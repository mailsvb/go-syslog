# nfpm configuration: https://nfpm.goreleaser.com/configuration/
name: go-syslog
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: admin
maintainer: mailsvb <mailsvb@users.noreply.github.com>
vendor: mailsvb
homepage: https://github.com/mailsvb/go-syslog
description: |
  UDP syslog collector that writes one file per sender IP and UTC hour
  (/var/log/go-syslog/<ip>/<YYYY-MM-DD_HH>.log) and deletes files older
  than 7 days.

contents:
  - src: dist/go-syslog
    dst: /usr/bin/go-syslog
    file_info:
      mode: 0755
  - src: packaging/go-syslog.service
    dst: /usr/lib/systemd/system/go-syslog.service
    file_info:
      mode: 0644
  - src: packaging/go-syslog.sysconfig
    dst: /etc/sysconfig/go-syslog
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/90-go-syslog.conf
    dst: /usr/lib/sysctl.d/90-go-syslog.conf
    file_info:
      mode: 0644
  - dst: /var/log/go-syslog
    type: dir
    file_info:
      mode: 0750
      owner: gosyslog
      group: gosyslog

scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

rpm:
  group: System/Daemons
  compression: zstd
  signature:
    # Set by the release workflow when the GPG_PRIVATE_KEY secret exists;
    # empty means the RPM is not signed.
    key_file: ${NFPM_RPM_KEY_FILE}
