# nfpm configuration for go-syslog-view: https://nfpm.goreleaser.com/configuration/
# Built by "make rpm" together with go-syslog, with the same version.
name: go-syslog-view
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: admin
maintainer: mailsvb <mailsvb@users.noreply.github.com>
vendor: mailsvb
homepage: https://github.com/mailsvb/go-syslog
description: |
  Read-only MCP server (streamable HTTP) for the log files written by
  go-syslog, so AI agents can list, count and search the collected
  syslog messages.

depends:
  - go-syslog

contents:
  - src: dist/go-syslog-view
    dst: /usr/bin/go-syslog-view
    file_info:
      mode: 0755
  - src: packaging/go-syslog-view.service
    dst: /usr/lib/systemd/system/go-syslog-view.service
    file_info:
      mode: 0644
  - src: packaging/go-syslog-view.sysconfig
    dst: /etc/sysconfig/go-syslog-view
    type: config|noreplace
    file_info:
      mode: 0644
  - dst: /etc/go-syslog-view
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: gosyslog-view

scripts:
  preinstall: packaging/scripts/view-preinstall.sh
  postinstall: packaging/scripts/view-postinstall.sh
  preremove: packaging/scripts/view-preremove.sh
  postremove: packaging/scripts/view-postremove.sh

rpm:
  group: System/Daemons
  compression: zstd
  signature:
    # Set by the release workflow when the signing key secret exists;
    # empty means the RPM is not signed.
    key_file: ${NFPM_RPM_KEY_FILE}
