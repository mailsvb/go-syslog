name: release

# Manual release: Actions -> release -> Run workflow -> enter a version (X.Y.Z).
# Builds the RPM, publishes it to the zypper repository on GitHub Pages
# (gh-pages branch, newest 5 RPMs kept) and creates the GitHub release vX.Y.Z.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (no leading v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  KEEP_RPMS: "5"
  NFPM_VERSION: v2.48.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: make test

      - name: Install tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
          sudo apt-get update -qq
          sudo apt-get install -y -qq createrepo-c

      - name: Import signing key (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY secret not set: RPM and repository will be unsigned"
            exit 0
          fi
          key_file="$RUNNER_TEMP/rpm-signing-key.asc"
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$key_file"
          gpg --batch --import "$key_file"
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "SIGN_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "NFPM_RPM_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build RPM
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: make rpm VERSION="$VERSION"

      - name: Assemble repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base_url="https://${owner}.github.io/${repo}/"
          mkdir -p site
          # Carry over the RPMs that are currently published.
          if git fetch -q origin gh-pages; then
            git archive FETCH_HEAD x86_64 2>/dev/null | tar -x -C site || true
          fi
          scripts/update-repo.sh site "$base_url" "$KEEP_RPMS" dist/go-syslog-"$VERSION"-*.rpm
          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"

      - name: Publish to gh-pages
        run: |
          # One orphan commit per release, force-pushed: old RPMs do not pile up in git history.
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "go-syslog repository: release $VERSION"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" dist/go-syslog-"$VERSION"-*.rpm \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            --notes "Install: zypper addrepo ${BASE_URL}go-syslog.repo && zypper install go-syslog"
